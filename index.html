<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Feynman English v3.8.2 · Complementos curados lote 2</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#171717;--muted:#666;--line:#ddd;--dark:#222;--ok:#17663d;--bad:#9d2c2c;--r:20px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}#app{max-width:620px;min-height:100vh;margin:auto;padding:18px 14px 100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:0 7px 25px #0000000a}
h1,h2,h3{margin:0 0 12px}h1{font-size:2.2rem;letter-spacing:-.05em}h2{font-size:1.55rem}.muted{color:var(--muted);line-height:1.55}.quote{margin:22px 0;padding:16px;border-left:4px solid var(--dark);background:#f0f0ec;border-radius:12px}
.btn{width:100%;min-height:54px;border-radius:15px;border:1px solid var(--dark);padding:13px 16px;font-weight:750;margin-top:10px}.primary{background:var(--dark);color:white}.secondary{background:white;color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat{background:#f1f1ee;border-radius:14px;padding:12px;text-align:center}.stat strong{display:block;font-size:1.35rem}
.toolbar{display:grid;gap:10px;margin:14px 0}input,select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:13px;padding:11px;background:white}
.list{display:grid;gap:10px}.lesson{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;text-align:left}.lesson.done{border-color:#8ec5a5}.tag{display:inline-block;background:#eee;border-radius:999px;padding:5px 9px;font-size:.78rem;color:#555;margin-bottom:7px}
.progress{height:9px;background:#e5e5e0;border-radius:99px;overflow:hidden;margin:8px 0 20px}.progress div{height:100%;background:var(--dark)}.big{font-size:2rem;font-weight:800;margin:18px 0 8px}.translation{font-size:1.2rem;color:var(--muted)}
.choice{width:100%;min-height:52px;border:1px solid var(--line);border-radius:14px;background:white;text-align:left;padding:13px;margin-top:9px}.choice:hover{border-color:#222}
.feedback{padding:14px;border-radius:13px;margin-top:13px;line-height:1.5}.ok{background:#eaf6ef;color:var(--ok)}.bad{background:#faecec;color:var(--bad)}
.wordbank,.answerzone{display:flex;flex-wrap:wrap;gap:9px;min-height:65px;border:1px dashed var(--line);border-radius:14px;padding:12px;margin:12px 0}.chip{border:1px solid #aaa;border-radius:12px;background:white;padding:10px 13px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,620px);display:grid;grid-template-columns:repeat(4,1fr);background:#fffffff2;border-top:1px solid var(--line);backdrop-filter:blur(12px)}.nav button{border:0;background:transparent;min-height:68px;font-weight:700;font-size:.78rem}
.pagination{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:15px}.pagination button{min-height:44px;border:1px solid var(--line);background:white;border-radius:12px;padding:8px 14px}.center{text-align:center}.hidden{display:none}
@media(max-width:420px){.card{padding:18px}h1{font-size:1.9rem}.stats{grid-template-columns:1fr 1fr 1fr}}

.verb-card{display:grid;grid-template-columns:1.1fr 1.4fr 1fr;gap:10px;align-items:center;text-align:left}
.verb-card .vbase{font-size:1.15rem;font-weight:800}
.verb-card .vpt{color:var(--muted)}
.verb-card .vpast{text-align:right}
.verb-card .vtype{font-size:.72rem;padding:4px 8px;border-radius:999px;background:#f0f0ec;display:inline-block;margin-top:4px}
.planbox{background:#f2f2ef;border-radius:18px;padding:18px;margin:14px 0}
.planrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}
.planrow:last-child{border-bottom:0}
.locked{opacity:.45}
.review-badge{font-size:.75rem;padding:5px 9px;border-radius:999px;background:#fff0d7}
.memory-badge{font-size:.75rem;padding:5px 9px;border-radius:999px;background:#e9f6ee;color:#1f6b45}


.path-hero{background:linear-gradient(180deg,#f2f2ef,#fff);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.path-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.level-pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 10px;background:#222;color:#fff;font-size:.78rem;font-weight:800}
.path-track{position:relative;margin:18px 0 4px;padding-left:48px}
.path-track:before{content:"";position:absolute;left:20px;top:18px;bottom:18px;width:3px;background:#deded8;border-radius:99px}
.path-level{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 16px}
.path-level:before{content:"";position:absolute;left:-39px;top:22px;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid #aaa;z-index:2}
.path-level.active{border-color:#222;box-shadow:0 8px 24px #0000000b}
.path-level.active:before{background:#222;border-color:#222}
.path-level.done:before{content:"✓";display:grid;place-items:center;background:#17663d;border-color:#17663d;color:white;font-size:.7rem;font-weight:900}
.path-level.locked{opacity:.58}
.path-level.locked:before{content:"🔒";display:grid;place-items:center;border:0;background:#e8e8e4;width:28px;height:28px;left:-42px;top:19px;font-size:.8rem}
.path-level h3{margin:4px 0 6px}
.path-level .mini{font-size:.82rem;color:var(--muted);line-height:1.45}
.module-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.module-card{border:1px solid var(--line);border-radius:14px;padding:11px;background:#fafaf8}
.module-card.done{border-color:#8ec5a5;background:#f3faf5}
.module-card strong{display:block;font-size:.88rem}
.module-card span{font-size:.75rem;color:var(--muted)}
.level-progress{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 6px;font-size:.82rem}
@media(max-width:420px){.module-grid{grid-template-columns:1fr}.path-track{padding-left:42px}}


/* v3.4.0 — linguagem visual comum para os recursos de estudo */
:root{--study-blue:#2479df;--study-blue-soft:#eef5ff;--study-blue-line:#5d9ce9}
.study-shell{padding:20px}
.study-header{margin-bottom:14px}
.study-header h2{margin-bottom:6px}
.study-card{
  border:2px solid var(--study-blue);
  background:#f8fbff;
  border-radius:24px;
  padding:28px 18px;
  min-height:190px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  margin:14px 0;
}
.study-card .study-sentence{font-size:1.65rem;font-weight:850;line-height:1.25}
.study-card .study-translation{margin-top:14px;font-size:1.05rem;color:var(--muted);line-height:1.4}
.study-card .tap-hint{margin-top:15px;color:#77808c;font-size:.9rem}
.shadowing-tip{
  background:#eef7ff;
  border:1px solid #cfe4fb;
  border-radius:16px;
  padding:13px 14px;
  margin:12px 0;
  line-height:1.45;
  color:#22527f
}
.shadowing-tip strong{color:#123f69}
.study-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.study-actions .btn{margin-top:0}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.mode-btn{
  min-height:46px;border:0;border-radius:14px;padding:10px 8px;
  font-weight:800;background:#eef2fb;color:#343789
}
.mode-btn.active{background:var(--study-blue);color:white}
.mode-btn:last-child:nth-child(odd){grid-column:1/-1}
.flash-modal{
  position:fixed;inset:0;background:#0007;z-index:9999;
  display:flex;align-items:center;justify-content:center;padding:18px
}
.flash-panel{
  width:min(100%,580px);max-height:92vh;overflow:auto;
  background:white;border-radius:28px;padding:24px;
  box-shadow:0 24px 70px #0005
}
.flash-panel h2{font-size:1.8rem}
.phrase-row{
  background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:15px 16px;margin-bottom:10px;box-shadow:0 2px 8px #00000005
}
.phrase-row strong{font-size:1.08rem;line-height:1.35}
.study-list .lesson{border-radius:18px;box-shadow:0 2px 8px #00000005}
.speaking-strip{
  display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
  margin:12px 0
}
.speaking-strip span{
  text-align:center;background:#f1f4f8;border-radius:12px;padding:9px 5px;
  font-size:.76rem;font-weight:800;color:#4d5661
}
@media(max-width:420px){
  .study-actions{grid-template-columns:1fr}
  .study-card{padding:24px 14px;min-height:175px}
  .study-card .study-sentence{font-size:1.45rem}
  .flash-panel{padding:18px;border-radius:24px}
}


/* v3.6.0 — speaking + active recall + reconhecimento de voz */
.voice-feedback{margin-top:10px}
.voice-feedback .feedback{margin:0}
.voice-heard{font-weight:850}
.recall-panel{
  border:2px solid var(--study-blue);
  background:#f8fbff;
  border-radius:24px;
  padding:25px 16px;
  text-align:center;
  margin:14px 0
}
.recall-panel .recall-pt{font-size:1.35rem;font-weight:850;line-height:1.35}
.recall-panel .recall-note{margin-top:10px;color:var(--muted);font-size:.92rem}
.recall-answer{
  margin-top:12px;padding:12px 14px;border-radius:14px;
  background:#eef5ff;font-weight:850
}
.voice-help{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.voice-help .btn{margin-top:0}
.voice-status{
  display:inline-flex;align-items:center;gap:6px;
  background:#f1f4f8;border-radius:999px;padding:6px 10px;
  font-size:.78rem;font-weight:800;color:#53606d;margin-bottom:8px
}
@media(max-width:420px){
  .voice-help{grid-template-columns:1fr}
}

function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim()}
let activeUtterance=null;
let speechToken=0;
function speak(t,r=.78){
  if(!('speechSynthesis' in window)){
    alert('Áudio não suportado neste navegador.');
    return;
  }
  const clean=(t||'').trim();
  if(!clean)return;
  try{
    const synth=window.speechSynthesis;
    const token=++speechToken;
    synth.cancel();
    activeUtterance=null;
    setTimeout(()=>{
      if(token!==speechToken)return;
      const u=new SpeechSynthesisUtterance(clean);
      activeUtterance=u;
      u.lang='en-US';
      u.rate=r;
      u.pitch=1;
      u.volume=1;
      u.onend=()=>{if(token===speechToken)activeUtterance=null};
      u.onerror=()=>{if(token===speechToken)activeUtterance=null};
      synth.cancel();
      synth.speak(u);
    },180);
  }catch(e){
    alert('Não foi possível reproduzir o áudio neste navegador.');
  }
}

const SpeechRecognitionCtor=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let activeVoiceRecognition=null;
let verbRecallHelp='none';
let basicReviewHelp='none';

function voiceRecognitionAvailable(){
  return !!SpeechRecognitionCtor && (window.isSecureContext===true || location.hostname==='localhost');
}
function voiceNormalize(s){
  return (s||'').toLowerCase()
    .replace(/[’‘]/g,"'")
    .replace(/\bi'm\b/g,'i am')
    .replace(/\bdon't\b/g,'do not')
    .replace(/\bdidn't\b/g,'did not')
    .replace(/\bwon't\b/g,'will not')
    .replace(/\bcan't\b/g,'cannot')
    .replace(/[^a-z0-9\s']/g,' ')
    .replace(/\s+/g,' ').trim();
}
function voiceWords(s){return voiceNormalize(s).split(' ').filter(Boolean)}
function voiceDistance(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    dp[i][j]=Math.min(
      dp[i-1][j]+1,
      dp[i][j-1]+1,
      dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)
    );
  }
  return dp[m][n];
}
function compareVoice(expected,heard){
  const e=voiceWords(expected),h=voiceWords(heard);
  const dist=voiceDistance(e,h),wer=dist/Math.max(1,e.length);
  if(dist===0)return {kind:'exact',dist,wer};
  if(wer<=0.25 || (dist===1&&e.length>=4))return {kind:'close',dist,wer};
  return {kind:'miss',dist,wer};
}
function runVoiceRecognition(expected,onDone,onError){
  if(!SpeechRecognitionCtor){
    onError('Reconhecimento de voz não disponível neste navegador.');
    return;
  }
  if(!voiceRecognitionAvailable()){
    onError('O reconhecimento de voz precisa ser aberto por HTTPS. Você ainda pode praticar falando em voz alta.');
    return;
  }
  try{
    if(activeVoiceRecognition){try{activeVoiceRecognition.abort()}catch(_e){}}
    const rec=new SpeechRecognitionCtor();
    activeVoiceRecognition=rec;
    rec.lang='en-US';
    rec.interimResults=false;
    rec.continuous=false;
    rec.maxAlternatives=5;

    rec.onresult=(ev)=>{
      const result=ev.results[0],alts=[];
      for(let i=0;i<result.length;i++){
        const transcript=(result[i].transcript||'').trim();
        const cmp=compareVoice(expected,transcript);
        alts.push({transcript,confidence:result[i].confidence||0,...cmp});
      }
      alts.sort((a,b)=>a.dist-b.dist || b.confidence-a.confidence);
      activeVoiceRecognition=null;
      onDone(alts[0]);
    };
    rec.onerror=(ev)=>{
      activeVoiceRecognition=null;
      const msg={
        'not-allowed':'Permissão do microfone negada.',
        'audio-capture':'Microfone não encontrado.',
        'network':'Falha de rede no reconhecimento de voz.',
        'no-speech':'Nenhuma fala foi detectada.'
      }[ev.error]||`Erro de reconhecimento: ${ev.error}`;
      onError(msg);
    };
    rec.onend=()=>{activeVoiceRecognition=null};
    rec.start();
  }catch(e){
    activeVoiceRecognition=null;
    onError(e.message||'Não foi possível iniciar o reconhecimento de voz.');
  }
}

function librarySearchNormalize(s){
  // Busca é tolerante a acentos/apóstrofos, mas respeita limites de palavras.
  return normalize(s||'').replace(/'/g,'');
}
function librarySearchMatch(text,query){
  const rawQuery=String(query||'');
  const endsWithSpace=/\s$/.test(rawQuery);
  const q=librarySearchNormalize(rawQuery);
  if(!q)return true;

  const queryWords=q.split(' ').filter(Boolean);
  const words=librarySearchNormalize(text).split(' ').filter(Boolean);
  if(!queryWords.length)return true;
  if(queryWords.length>words.length)return false;

  // Busca incremental por sequência de palavras:
  // - palavras concluídas precisam ser EXATAS;
  // - somente a última palavra pode ser prefixo enquanto ainda está sendo digitada;
  // - se houver espaço no final, a última palavra também é considerada concluída.
  //
  // Exemplos:
  // "he"     -> pode encontrar "Hello", "help", "Here" enquanto o usuário digita;
  // "he "    -> procura a palavra exata "he";
  // "he i"   -> procura "he" exato + próxima palavra começando com "i";
  // "i w"    -> encontra "I will...".
  for(let start=0;start<=words.length-queryWords.length;start++){
    let ok=true;
    for(let j=0;j<queryWords.length;j++){
      const isLast=(j===queryWords.length-1);
      const allowPrefix=isLast && !endsWithSpace;

      if(allowPrefix){
        if(!words[start+j].startsWith(queryWords[j])){ok=false;break}
      }else{
        if(words[start+j]!==queryWords[j]){ok=false;break}
      }
    }
    if(ok)return true;
  }
  return false;
}
let BASIC_LIBRARY_CACHE=null;

  const items=[];
  for(const v of VERBS){
    const vars=beginnerVariants(v);
    const forms=trainingForms(v);

    for(let fi=0;fi<forms.length;fi++){
      for(let vi=0;vi<vars.length;vi++){
        items.push({
          id:`basic-${v.id}-${fi}-${vi}`,

  return !q ||

    librarySearchMatch(item.pt,q) ||

}

    libraryItemMatches(item,q)
  );

  const basicItems=includeBasic
    ? basicLibraryItems().filter(item=>
        (category==='Todas'||category==='Frases básicas') &&
        libraryItemMatches(item,q)
      )
    : [];

  return [...lessonItems,...basicItems];
}

function openLibraryItem(itemId){
  const id=String(itemId);

  if(id.startsWith('basic-')){
    const parts=id.split('-');
    const verbId=Number(parts[1]);
    const formIndex=Number(parts[2]);
    const variantIndex=Number(parts[3]);
    openBasicLibraryPhrase(verbId,variantIndex,formIndex);
    return;
  }

  startLesson(Number(itemId));
}

function openBasicLibraryPhrase(verbId,variantIndex,formIndex){
  const v=VERBS.find(x=>x.id===verbId);
  if(!v)return;

  const vars=beginnerVariants(v);
  const forms=trainingForms(v);
  if(variantIndex<0||variantIndex>=vars.length)return;
  if(formIndex<0||formIndex>=forms.length)return;

  state.verbId=v.id;
  state.verbComp=0;
  state.verbDrillIndex=variantIndex;
  state.verbFormIndex=formIndex;
  state.verbAnswer='';
  state.verbTesting=true;
  state.verbPracticeKind='free';
  state.verbStep=1;
  state.screen='verbLesson';
  save();
  render();
}
function updateLibrarySearch(value,cursor){
  state.search=value;
  state.page=1;
  save();
  library();

  // library() recria o HTML da tela. Recoloca o foco no novo campo
  // para que a digitação continue normalmente no celular e no PC.
  const input=document.getElementById('library-search');
  if(input){
    try{input.focus({preventScroll:true})}catch(_e){input.focus()}
    const pos=Math.max(0,Math.min(Number.isFinite(cursor)?cursor:input.value.length,input.value.length));
    try{input.setSelectionRange(pos,pos)}catch(_e){}
  }
}

const REVIEW_OFFSETS=[0,1,3,7,14,30,60];

function dateKey(d=new Date()){return d.toISOString().slice(0,10)}
function dayDiff(a,b){
  const A=new Date(a+'T00:00:00'),B=new Date(b+'T00:00:00');
  return Math.floor((B-A)/86400000)
}

const BASIC_SRS_INTERVALS=[1,3,7,14,30,60];
const DAY_MS=86400000;

function ensureBasicSrs(){
  if(!state.basicSrs || typeof state.basicSrs!=='object'){
    state.basicSrs={version:1,items:{},migrationV1:false};
  }
  state.basicSrs.version=1;
  state.basicSrs.items=state.basicSrs.items||{};
  return state.basicSrs;
}
function basicCompKey(verbId,formIndex){
  return `${verbId}:${formIndex}`;
}
function basicCompItem(v,formIndex,create=false){
  const s=ensureBasicSrs(),key=basicCompKey(v.id,formIndex);
  if(!s.items[key] && create){
    s.items[key]={
      id:key,
      verbId:v.id,
      formIndex,
      stage:0,
      dueAt:Date.now()+BASIC_SRS_INTERVALS[0]*DAY_MS,
      reviewCount:0,
      lapseCount:0,
      lastOutcome:null,
      lastReviewedAt:null,
      lastVariantIndex:null,
      retry:false,
      retryVariantIndex:null,
      active:true
    };
  }
  return s.items[key]||null;
}
function activateBasicCompetencies(v,options={}){
  const opts=options||{};
  const forms=trainingForms(v);
  const r=verbRecord(v.id);
  const completedLegacy=(r.reviews||[]).filter(x=>Number(x)>0).length;
  const migratedStage=Math.min(completedLegacy,BASIC_SRS_INTERVALS.length-1);

  for(let fi=0;fi<forms.length;fi++){
    const existing=basicCompItem(v,fi,false);
    if(existing)continue;

    const item=basicCompItem(v,fi,true);
    if(opts.fromLegacy){
      item.stage=migratedStage;
      item.reviewCount=completedLegacy;

      if(completedLegacy>=BASIC_SRS_INTERVALS.length){
        item.dueAt=Date.now()+BASIC_SRS_INTERVALS[BASIC_SRS_INTERVALS.length-1]*DAY_MS;
      }else{
        const nextOffset=BASIC_SRS_INTERVALS[completedLegacy];
        const base=new Date(`${r.firstStudy}T00:00:00`).getTime();
        item.dueAt=base+(nextOffset*DAY_MS);
      }
    }
  }
}
function migrateLegacyBasicSrs(){
  const s=ensureBasicSrs();
  if(s.migrationV1)return;

  for(const v of VERBS){
    const r=state.verbHistory&&state.verbHistory[v.id];
    if(r&&r.firstStudy)activateBasicCompetencies(v,{fromLegacy:true});
  }
  s.migrationV1=true;
  save();
}
function basicCompetenciesForVerb(v){
  const s=ensureBasicSrs();
  return trainingForms(v)
    .map((_,fi)=>s.items[basicCompKey(v.id,fi)])
    .filter(Boolean)
    .filter(item=>item.active!==false);
}
function basicDueCompetenciesForVerb(v){
  const now=Date.now();
  return basicCompetenciesForVerb(v)
    .filter(item=>item.retry===true || Number(item.dueAt||0)<=now)
    .sort((a,b)=>{
      if(!!a.retry!==!!b.retry)return a.retry?1:-1;
      return Number(a.dueAt||0)-Number(b.dueAt||0);
    });
}
function basicDueCompetencyCount(){
  return VERBS.reduce((n,v)=>n+basicDueCompetenciesForVerb(v).length,0);
}
function gcdInt(a,b){
  a=Math.abs(a);b=Math.abs(b);
  while(b){const t=b;b=a%b;a=t}
  return a||1;
}
function basicRotationStep(n){
  if(n<=1)return 1;
  const preferred=[7,9,11,13,17,19,23,29,31,37,3,5];
  for(const step of preferred){
    if(step<n && gcdInt(step,n)===1)return step;
  }
  for(let step=2;step<n;step++){
    if(gcdInt(step,n)===1)return step;
  }
  return 1;
}
function basicSrsVariantIndex(item,v){
  const vars=beginnerVariants(v);
  const n=vars.length;
  if(!n)return 0;

  if(item.retry===true && Number.isInteger(item.retryVariantIndex)){
    return Math.max(0,Math.min(item.retryVariantIndex,n-1));
  }

  const seed=((v.id*11)+(item.formIndex*5))%n;
  const step=basicRotationStep(n);
  return (seed+((item.reviewCount||0)*step))%n;
}
function basicSrsStageLabel(item){
  const stage=Math.max(0,Math.min(Number(item.stage||0),BASIC_SRS_INTERVALS.length-1));
  return `${BASIC_SRS_INTERVALS[stage]} dia${BASIC_SRS_INTERVALS[stage]===1?'':'s'}`;
}
function ensurePlan(){
  if(!state.planStart){return false}
  return true
}
function planDay(){
  if(!state.planStart)return 1;
  return Math.max(1,Math.min(90,dayDiff(state.planStart,dateKey())+1))
}
function start90DayPlan(){
  if(!state.planStart)state.planStart=dateKey();
  save();render()
}
function scheduledVerbForDay(day){
  // Days 1–40: 40 regular verbs. Days 41–80: 40 irregular verbs.
  // Days 81–90: consolidation only.
  if(day>=1&&day<=80)return VERBS[day-1];
  return null
}
function verbRecord(id){
  state.verbHistory=state.verbHistory||{};
  if(!state.verbHistory[id])state.verbHistory[id]={firstStudy:null,reviews:[],createdChunks:[],mastery:'new'};
  return state.verbHistory[id]
}
function reviewDueForVerb(v){
  const comps=basicCompetenciesForVerb(v);
  if(comps.length)return basicDueCompetenciesForVerb(v).length>0;

  // Fallback legado: preservado para dados antigos que ainda não tenham sido migrados.
  const r=verbRecord(v.id);
  if(!r.firstStudy)return false;
  const elapsed=dayDiff(r.firstStudy,dateKey());
  const completed=new Set(r.reviews||[]);
  return REVIEW_OFFSETS.some(off=>off<=elapsed&&!completed.has(off));
}
function nextReviewOffset(v){
  const r=verbRecord(v.id);
  if(!r.firstStudy)return 0;
  const completed=new Set(r.reviews||[]);
  return REVIEW_OFFSETS.find(off=>!completed.has(off)) ?? null;
}
function masteryLabel(v){
  const r=verbRecord(v.id);
  const chunks=(r.createdChunks||[]).length;
  if(!r.firstStudy)return 'Novo';
  if(chunks<3)return `Criar frases (${chunks}/3)`;

  const comps=basicCompetenciesForVerb(v);
  if(comps.length){
    const due=basicDueCompetenciesForVerb(v).length;
    if(due)return `Revisar (${due})`;

    const minStage=Math.min(...comps.map(x=>Number(x.stage||0)));
    if(minStage>=5)return 'Memória longa';
    if(minStage>=3)return 'Retenção forte';
    if(minStage>=1)return 'Em consolidação';
    return 'Em prática';
  }

  // Fallback legado
  const n=(r.reviews||[]).length;
  if(n>=6)return 'Memória longa';
  if(n>=4)return 'Retenção forte';
  if(n>=2)return 'Em consolidação';
  return 'Em prática';
}
function canStudyNewVerb(){
  // O novo verbo do dia só abre se não houver revisão vencida de verbos já estudados
  // e se o verbo anterior tiver pelo menos 3 chunks criados.
  const due=VERBS.filter(v=>reviewDueForVerb(v));
  if(due.length)return false;
  const day=planDay(), prev=scheduledVerbForDay(day-1);
  if(prev){
    const r=verbRecord(prev.id);
    if(r.firstStudy && (r.createdChunks||[]).length<3)return false;
  }
  return true
}
function dueVerbs(){
  return VERBS.filter(v=>reviewDueForVerb(v));
}
function verbFiltered(){
  const q=normalize(state.verbSearch||'');

function beginnerVariants(v){
  if(v.base==='work' && v.beginnerVariants && v.beginnerVariants.length>=40)return v.beginnerVariants.slice(0,40);
  if(CURATED_BEGINNER_VARIANTS[v.base])return CURATED_BEGINNER_VARIANTS[v.base].slice(0,40);
  return (v.beginnerVariants&&v.beginnerVariants.length?v.beginnerVariants:v.complements)||[];
}
function trainingForms(v){
  if(v.trainingForms&&v.trainingForms.length)return v.trainingForms;
  return [
    {id:'present',label:'Presente',prefix:`I ${v.base}`},
    {id:'negative',label:'Negativa',prefix:`I don't ${v.base}`},
    {id:'past',label:'Passado',prefix:`I ${v.past}`},
    {id:'past_negative',label:'Passado negativo',prefix:`I didn't ${v.base}`},
    {id:'future',label:'Futuro',prefix:`I will ${v.base}`}
  ];
}
function trainingSentence(v,variantIndex=null,formIndex=null){
  const vars=beginnerVariants(v), forms=trainingForms(v);
  const vi=variantIndex===null?(state.verbDrillIndex||0):variantIndex;
  const fi=formIndex===null?(state.verbFormIndex||0):formIndex;
  return `${forms[fi].prefix} ${vars[vi].en}.`;
}
function trainingTranslation(v,variantIndex=null,formIndex=null){
  const vars=beginnerVariants(v);
  const vi=variantIndex===null?(state.verbDrillIndex||0):variantIndex;
  const fi=formIndex===null?(state.verbFormIndex||0):formIndex;
  const c=vars[vi].pt;
  const f=PT_VERB_FORMS[v.base];
  if(!f)return `Eu ${v.pt} ${c}.`;
  if(fi===0)return `Eu ${f.present} ${c}.`;
  if(fi===1)return `Eu não ${f.present} ${c}.`;
  if(fi===2)return `Eu ${f.past} ${c}.`;
  if(fi===3)return `Eu não ${f.past} ${c}.`;
  if(v.base==='go')return `Eu irei ${c}.`;
  return `Eu vou ${f.inf} ${c}.`;
}

  (stages[state.verbStep]||verbSummary)(v)

function nextStructuredDrill(){
  const v=currentVerb(), vars=beginnerVariants(v), forms=trainingForms(v);
  let vi=state.verbDrillIndex||0, fi=state.verbFormIndex||0;
  if(vi+1<vars.length) vi++;
  else { vi=0; if(fi+1<forms.length) fi++; else { state.verbDrillIndex=0; state.verbFormIndex=0; state.verbStep=state.verbTesting?3:2; save();render();return; } }
  state.verbDrillIndex=vi;state.verbFormIndex=fi;save();render()
}

function verbCreateChunks(v){
  const r=verbRecord(v.id);r.createdChunks=r.createdChunks||[];
  const chunks=r.createdChunks.slice(0,3), count=chunks.length;
  if(r.createdChunks.length>3) r.createdChunks=r.createdChunks.slice(0,3);
  verbFrame(v,`<h2>Crie 3 frases suas</h2>
    <p class="muted">Máximo de 3 frases. Você pode usar qualquer estrutura treinada: <strong>I work</strong>, <strong>I don't work</strong>, <strong>I worked</strong>, <strong>I didn't work</strong> ou <strong>I will work</strong>. Você pode editar ou excluir qualquer uma.</p>
    <div class="feedback">${chunks.length?chunks.map((x,i)=>ownChunkRow(v,x,i)).join(''):'Nenhuma frase criada ainda.'}</div>
    ${count<3?`<input id="ownChunk" placeholder="Ex.: I ${v.base} near my house"><button class="btn primary" onclick="saveOwnVerbChunk()">SALVAR FRASE</button>`:''}
    <button class="btn secondary" ${count===3?'':'disabled'} onclick="state.verbStep=3;save();render()">CONCLUIR (${count}/3)</button>

function validateOwnChunk(v,val,ignoreIndex=null){
  const clean=(val||'').trim();
  if(!clean)return {ok:false,msg:'Digite uma frase curta.'};
  const n=normalize(clean).replace(/[.!?]+$/,'').replace(/\s+/g,' ').trim();

  // Nas frases próprias, aceite as cinco estruturas que acabaram de ser treinadas.
  // Para WORK: I work / I don't work / I worked / I didn't work / I will work.
  const forms=trainingForms(v);
  const prefixes=forms.map(f=>normalize(f.prefix).replace(/\s+/g,' ').trim());
  const matched=prefixes.find(prefix=>n===prefix || n.startsWith(prefix+' '));

  if(!matched){
    const examples=forms.map(f=>f.prefix+'...').join(' / ');
    return {ok:false,msg:`Use uma das estruturas treinadas: ${examples}`};
  }

  const tail=n.slice(matched.length).trim();
  if(!tail)return {ok:false,msg:'Acrescente uma informação depois do verbo.'};

  const r=verbRecord(v.id), arr=(r.createdChunks||[]).slice(0,3);
  if(arr.some((x,i)=>i!==ignoreIndex&&normalize(x)===normalize(clean)))
    return {ok:false,msg:'Essa frase já existe. Crie outra.'};

  return {ok:true,value:clean};
}
function saveOwnVerbChunk(){
  const v=currentVerb(),r=verbRecord(v.id);r.createdChunks=(r.createdChunks||[]).slice(0,3);
  const fb=document.getElementById('verbfb');
  if(r.createdChunks.length>=3){fb.innerHTML='<div class="feedback bad">Você já criou 3 frases. Edite ou exclua uma para substituir.</div>';return}
  const inp=document.getElementById('ownChunk'),res=validateOwnChunk(v,inp?inp.value:'');
  if(!res.ok){fb.innerHTML=`<div class="feedback bad">${res.msg}</div>`;return}
  r.createdChunks.push(res.value);save();render()
}

function deleteOwnChunk(i){

}
function currentBasicReviewItem(v){
  const due=basicDueCompetenciesForVerb(v);
  if(!due.length){
    state.basicReviewKey=null;
    return null;
  }

  const s=ensureBasicSrs();
  let item=state.basicReviewKey?s.items[state.basicReviewKey]:null;
  if(!item || item.verbId!==v.id || !due.some(x=>x.id===item.id)){
    item=due[0];
    state.basicReviewKey=item.id;

  }
  return item;
}
function basicReviewContext(v,item){
  const forms=trainingForms(v);

  const vi=basicSrsVariantIndex(item,v);
  return {
    form:forms[fi],

    variantIndex:vi,
    en:trainingSentence(v,vi,fi),
    pt:trainingTranslation(v,vi,fi)
  };
}

    }

function basicReviewOutcome(outcome){
  const v=currentVerb();if(!v)return;
  const item=currentBasicReviewItem(v);if(!item)return;

  const now=Date.now();
  const currentVariant=basicSrsVariantIndex(item,v);
  const wasRetry=item.retry===true;

  item.lastVariantIndex=currentVariant;
  item.lastReviewedAt=now;
  item.lastOutcome=outcome;
  item.reviewCount=(item.reviewCount||0)+1;
  item.retry=false;
  item.retryVariantIndex=null;

  if(outcome==='recalled'){
    if(wasRetry){
      item.stage=0;
      item.dueAt=now+BASIC_SRS_INTERVALS[0]*DAY_MS;
    }else{
      item.stage=Math.min((item.stage||0)+1,BASIC_SRS_INTERVALS.length-1);
      item.dueAt=now+BASIC_SRS_INTERVALS[item.stage]*DAY_MS;
    }
  }else if(outcome==='audio_help'){
    if(wasRetry)item.stage=0;
    item.dueAt=now+BASIC_SRS_INTERVALS[item.stage||0]*DAY_MS;
  }else if(outcome==='text_help'){
    if(wasRetry)item.stage=0;
    else item.stage=Math.max((item.stage||0)-1,0);
    item.dueAt=now+BASIC_SRS_INTERVALS[item.stage]*DAY_MS;
  }else{
    item.stage=0;
    item.lapseCount=(item.lapseCount||0)+1;
    item.dueAt=now+BASIC_SRS_INTERVALS[0]*DAY_MS;
    item.retry=true;
    item.retryVariantIndex=currentVariant;
  }

  state.basicReviewKey=null;
  basicReviewHelp='none';
  save();
  render();
}

function currentChunk(){return CHUNKS.find(c=>c.id===state.chunkId)}
function startChunk(id){
  const c=CHUNKS.find(x=>x.id===id); if(!c)return;
  state.chunkId=id;state.chunkStep=0;state.screen='chunkLesson';state.chunkSelections={};state.chunkBuildInitialized=false;
  Object.keys(c.slots).forEach(k=>state.chunkSelections[k]=0);

function fillChunk(c,translate=false){

    const idx=state.chunkSelections[k]||0;

  });

}

  voiceListeningBox('flash-recall-feedback');
  runVoiceRecognition(expected,res=>{
    const el=document.getElementById('flash-recall-feedback');if(!el)return;
    if(res.kind==='exact'){
      const help=flashRecallHelp==='none'?'sem ajuda':flashRecallHelp==='audio'?'após ouvir o modelo':'após ver a frase';
      el.innerHTML=`<div class="feedback ok"><strong>✓ Frase reconhecida ${help}</strong><br>Entendi: <span class="voice-heard">${escapeAttr(res.transcript)}</span></div>`;
      document.getElementById('flash-recall-answer')?.classList.remove('hidden');
      document.getElementById('flash-recall-next')?.classList.remove('hidden');
    }else if(res.kind==='close'){
      el.innerHTML=`<div class="feedback"><strong>~ Quase.</strong><br>Entendi: <span class="voice-heard">${escapeAttr(res.transcript)}</span><br>Tente novamente.</div>`;
    }else{
      el.innerHTML=`<div class="feedback bad"><strong>× Tente novamente.</strong><br>Entendi: <span class="voice-heard">${escapeAttr(res.transcript)}</span><br>Use o áudio ou revele o inglês se precisar.</div>`;
    }
  },msg=>{
    const el=document.getElementById('flash-recall-feedback');if(!el)return;
    el.innerHTML=`<div class="feedback bad">${escapeAttr(msg)}</div>`;
    document.getElementById('flash-recall-fallback')?.classList.remove('hidden');
  });
}
function continueFlashRecallWithoutRecognition(){
  document.getElementById('flash-recall-answer')?.classList.remove('hidden');
  document.getElementById('flash-recall-next')?.classList.remove('hidden');
}

function frame(l,body){shell(`<section class="card study-shell"><span class="tag">${l.category}</span><div class="progress"><div style="width:${((state.step+1)/5)*100}%"></div></div>${body}</section>`)}
function intro(l){frame(l,`<div class="study-header"><h2>Aprender</h2></div>${shadowingTip()}${studyCard(l.en,l.pt,'lesson-intro-translation',true)}${speakingStrip()}<div class="study-actions"><button class="btn secondary" onclick='speak(${JSON.stringify(l.en)},.68)'>🔊 DEVAGAR</button><button class="btn secondary" onclick='speak(${JSON.stringify(l.en)},1)'>🔊 NORMAL</button></div><button class="btn primary" onclick="next()">CONTINUAR</button>`)}
function shuffledOptions(l){const arr=[l.pt,...l.distractors];return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function meaning(l){if(!state.meanOpts||state.meanFor!==l.id){state.meanOpts=shuffledOptions(l);state.meanFor=l.id;save()}frame(l,`<h2>Compreender</h2><p class="muted">Qual é o significado de:</p><div class="big">${l.en}</div>${state.meanOpts.map(x=>`<button class="choice" onclick='checkMeaning(${JSON.stringify(x)})'>${x}</button>`).join('')}<div id="fb"></div>`)}
function checkMeaning(x){const l=current(),fb=document.getElementById('fb');if(x===l.pt){fb.innerHTML='<div class="feedback ok">Correto. Você reconheceu o significado.</div><button class="btn primary" onclick="next()">CONTINUAR</button>'}else{bump(l.id);fb.innerHTML='<div class="feedback bad">Ainda não. Ouça e compare novamente.</div>'}}
function wordsFor(l){return l.en.replace(/[.?!]/g,'').split(' ')}
function rebuild(l){if(!state.wordPool||state.wordFor!==l.id){state.wordFor=l.id;state.currentWords=[];state.wordPool=wordsFor(l).map((w,i)=>({w,i,r:Math.random()})).sort((a,b)=>a.r-b.r);save()}frame(l,`<h2>Reconstruir</h2><p class="muted">Monte a frase em inglês:</p><div class="translation">${l.pt}</div><div class="answerzone">${(state.currentWords||[]).map((x,j)=>`<button class="chip" onclick="removeWord(${j})">${x.w}</button>`).join('')}</div><div class="wordbank">${(state.wordPool||[]).map((x,j)=>`<button class="chip" onclick="addWord(${j})">${x.w}</button>`).join('')}</div><button class="btn primary" onclick="checkBuild()">VERIFICAR</button><div id="fb"></div>`)}
function addWord(i){state.currentWords=state.currentWords||[];state.currentWords.push(state.wordPool.splice(i,1)[0]);save();render()}
function removeWord(i){state.wordPool.push(state.currentWords.splice(i,1)[0]);save();render()}
function checkBuild(){const l=current(),ans=(state.currentWords||[]).map(x=>x.w).join(' '),fb=document.getElementById('fb');if(normalize(ans)===normalize(l.en)){fb.innerHTML='<div class="feedback ok">Você reconstruiu a frase corretamente.</div><button class="btn primary" onclick="next()">CONTINUAR</button>'}else{bump(l.id);fb.innerHTML='<div class="feedback bad">A ordem ainda não está correta. Tente novamente.</div>'}}
function recall(l){frame(l,`<h2>Criar sem olhar</h2><p class="muted">Digite a frase em inglês a partir do significado:</p><div class="translation">${l.pt}</div><input id="recallInput" placeholder="Digite em inglês" autocomplete="off"><button class="btn primary" onclick="checkRecall()">VERIFICAR</button><button class="btn secondary" onclick="document.getElementById('hint').classList.remove('hidden');bump(${l.id})">MOSTRAR DICA</button><div id="hint" class="feedback hidden">Começa com: <strong>${wordsFor(l).slice(0,Math.min(3,wordsFor(l).length)).join(' ')}...</strong></div><div id="fb"></div>`)}
function acceptable(user,target){const a=normalize(user),b=normalize(target);if(a===b)return true;const strip=x=>x.replace(/\b(a|an|the)\b/g,'').replace(/\s+/g,' ').trim();return strip(a)===strip(b)}
function checkRecall(){const l=current(),v=document.getElementById('recallInput').value,fb=document.getElementById('fb');if(acceptable(v,l.en)){fb.innerHTML=`<div class="feedback ok">Você criou a frase sem olhar.<br><strong>${l.en}</strong></div><button class="btn primary" onclick="next()">VER RESUMO</button>`}else{bump(l.id);fb.innerHTML=`<div class="feedback bad">Ainda há diferença.<br><strong>Forma esperada:</strong> ${l.en}<br>Leia uma vez, depois tente novamente sem copiar.</div>`}}
function bump(id){state.attempts[id]=(state.attempts[id]||0)+1;save()}
function summary(l){const tries=state.attempts[l.id]||0,level=tries===0?'Criando sozinho':tries<3?'Criando com apoio':'Praticando';frame(l,`<h2>Lição concluída</h2><div class="big">${l.en}</div><div class="translation">${l.pt}</div><div class="stats"><div class="stat"><strong>✓</strong><span>compreendeu</span></div><div class="stat"><strong>✓</strong><span>reconstruiu</span></div><div class="stat"><strong>${tries}</strong><span>ajudas/erros</span></div></div><p class="muted"><strong>Estado:</strong> ${level}<br><strong>Próxima revisão:</strong> amanhã</p><button class="btn primary" onclick="completeCurrent()">CONCLUIR</button>`)}
function completeCurrent(){const l=current();state.completed[l.id]={date:Date.now(),level:(state.attempts[l.id]||0)};state.reviews=(state.reviews||[]).filter(r=>r.id!==l.id);state.reviews.push({id:l.id,due:Date.now()+86400000,interval:1});state.meanOpts=null;state.wordPool=null;state.screen='home';save();render()}
function review(){const due=(state.reviews||[]).filter(r=>r.due<=Date.now());const future=(state.reviews||[]).filter(r=>r.due>Date.now());if(!due.length){shell(`<section class="card study-shell"><h2>Revisões</h2><p class="muted">Nenhuma revisão disponível agora.</p><p class="muted">Programadas: ${future.length}</p><button class="btn primary" onclick="go('library')">ESTUDAR NOVA FRASE</button></section>`);return}const r=due[0],l=LESSONS.find(x=>x.id===r.id);shell(`<section class="card study-shell"><span class="tag">Revisão</span><div class="study-header"><h2>Fale antes de escrever</h2></div><div class="study-card"><div class="study-translation">${l.pt}</div></div><div class="shadowing-tip"><strong>🎤 Recuperação oral:</strong> diga a frase em inglês em voz alta antes de digitar. A escrita serve para confirmar o que você conseguiu falar.</div><input id="reviewInput" placeholder="Depois de falar, digite a frase em inglês"><button class="btn primary" onclick="checkReview(${r.id})">VERIFICAR</button><div id="fb"></div></section>`)}
function checkReview(id){const l=LESSONS.find(x=>x.id===id),v=document.getElementById('reviewInput').value,fb=document.getElementById('fb');if(acceptable(v,l.en)){let r=state.reviews.find(x=>x.id===id);r.interval=Math.min((r.interval||1)*2,60);r.due=Date.now()+r.interval*86400000;save();fb.innerHTML=`<div class="feedback ok">Correto. Próxima revisão em ${r.interval} dias.</div><button class="btn primary" onclick="review()">CONTINUAR</button>`}else{let r=state.reviews.find(x=>x.id===id);r.interval=1;r.due=Date.now()+86400000;save();fb.innerHTML=`<div class="feedback bad">Forma esperada: <strong>${l.en}</strong><br>A revisão voltará amanhã.</div>`}}
function notebook(){const done=LESSONS.filter(l=>state.completed[l.id]);shell(`<section class="card"><h2>Caderno Feynman</h2><p class="muted">${done.length} frases estudadas. Use o caderno também para reler e falar em voz alta.</p>${done.length?`<div class="list study-list">${done.map(l=>`<button class="lesson" onclick="startLesson(${l.id})"><span class="tag">${l.category}</span><strong style="display:block">${l.en}</strong><span class="muted">${l.pt}</span></button>`).join('')}</div>`:'<p class="muted">Conclua uma lição para adicioná-la ao caderno.</p>'}<button class="btn secondary" onclick="resetAll()">APAGAR PROGRESSO LOCAL</button></section>`)}
window.addEventListener('error',e=>{if(!app.innerHTML.trim())app.innerHTML='<section class="card"><h2>Erro ao iniciar</h2><p>'+e.message+'</p></section>'});migrateLegacyBasicSrs();render();
</script></body></html>
